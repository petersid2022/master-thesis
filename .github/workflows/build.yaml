name: Compile Thesis

on:
  push:
    paths:
      - thesis.tex
      - thesis.bib
      - figures/**
      - .github/workflows/build.yaml
      - .github/spell-ignore.txt

permissions:
  contents: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install aspell dictionaries (English + Greek)
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en aspell-el
      - name: Spellcheck thesis body (English + Greek)
        env:
          LANG: C.UTF-8
        shell: bash
        run: |
          set -euo pipefail

          ignore_src=".github/spell-ignore.txt"
          tmpdir="$(mktemp -d)"
          body="$tmpdir/body.tex"
          ignore="$tmpdir/ignore.txt"

          # Preamble is font/package names. Check the document body only.
          awk 'BEGIN{p=0} /\\begin\{document\}/{p=1} p{print} /\\end\{document\}/{exit}' \
            thesis.tex > "$body"

          grep -vE '^\s*(#|$)' "$ignore_src" | LC_ALL=C sort -u > "$ignore"

          aspell --encoding=utf-8 --lang=en_US --mode=tex list < "$body" \
            | LC_ALL=C sort -u > "$tmpdir/en.txt"
          aspell --encoding=utf-8 --lang=el_GR --mode=tex list < "$body" \
            | LC_ALL=C sort -u > "$tmpdir/el.txt"

          # Flagged by both dictionaries: not English and not Greek.
          # Drop acronyms, short tokens, math fragments, and CamelCase identifiers.
          comm -12 "$tmpdir/en.txt" "$tmpdir/el.txt" | awk '
            length($0) < 4 { next }
            $0 ~ /^[A-Z0-9]+$/ { next }
            $0 ~ /[0-9_]/ { next }
            $0 ~ /[a-z][A-Z]/ { next }
            { print }
          ' | grep -viFxf "$ignore" > "$tmpdir/miss.txt" || true

          if [[ -s "$tmpdir/miss.txt" ]]; then
            echo "Misspellings found in thesis.tex:"
            cat "$tmpdir/miss.txt"
            echo
            echo "Add a true typo fix, or a word to .github/spell-ignore.txt."
            exit 1
          fi

          echo "No misspellings found in thesis.tex"

  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: thesis.tex
          os: debian
          latexmk_use_lualatex: true
          args: >-
            -pdflua -file-line-error -halt-on-error
            -interaction=nonstopmode
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis.pdf
      - name: Create GitHub Release and Upload PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-${{ github.sha }}
          name: Thesis Release ${{ github.sha }}
          body: Compiled PDF of the thesis.
          files: thesis.pdf
